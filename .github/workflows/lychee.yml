name: Link Check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/*.md'
      - 'site/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/*.md'
      - 'site/**/*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --timeout 30
            --exclude-mail
            --cache
            --max-cache-age 1d
            --exclude 'https://crates.io/crates/.*'
            './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
