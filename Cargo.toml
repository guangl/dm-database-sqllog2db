[package]
name = "dm-database-sqllog2db"
version = "1.20.1"
edition = "2024"
rust-version = "1.85"
authors = ["guangl <guangl@example.com>"]
description = "高性能 CLI 工具：流式解析达梦数据库 SQL 日志并导出到 CSV 或 SQLite"
documentation = "https://guangl.github.io/sqllog2db/"
homepage = "https://github.com/guangl/sqllog2db"
repository = "https://github.com/guangl/sqllog2db"
keywords = ["cli", "dm-database", "sqllog"]
categories = ["command-line-utilities"]
default-run = "sqllog2db"
license = "Apache-2.0"
readme = "README.md"

exclude = [
  "/examples/*",
  "/docs/*",
  "/.github/*",
  "/.vscode/*",
  "/logs/*",
  "/sqllogs/*",
  "/export/*",
  "/outputs/*",
  "config.toml",
]

[[bin]]
name = "sqllog2db"
path = "src/main.rs"

[dependencies]
dm-database-parser-sqllog = { version = "2.0.4", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
env_logger = "0.11.10"
log = "0.4.32"
thiserror = "2.0.18"
itoa = "1.0"

clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }
ctrlc = "3"
notify = "8"
glob = "0.3"

indicatif = "0.18"
rayon = "1.12"
memchr = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.27.0"


[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# 唯一保留的 allow：multiple_crate_versions 检查的是依赖图（外部 crate），不是本仓库代码。
# 剩余冲突全部在依赖自身子树内，无法从本仓库 Cargo.toml 修复：
#   - hashbrown 0.16/0.17：rusqlite 内部（sqlite-wasm-rs + hashlink）
#   - windows-sys 0.60/0.61：notify 落后于其余生态
#   - bitflags 1.x/2.x：rusqlite 的 sqlite-wasm-rs 在 wasm/WASI target 的子树
# 待上游收敛后即可移除本行。cargo 组其余 lint 仍生效。
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.flamegraph]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tikv-jemallocator = { version = "0.6.1", features = ["stats"] }
tikv-jemalloc-ctl = { version = "0.6.1", features = ["stats"] }

[[bench]]
name = "bench_csv"
harness = false

[[bench]]
name = "bench_sqlite"
harness = false

[[bench]]
name = "bench_filters"
harness = false

[[bench]]
name = "bench_parser"
harness = false
