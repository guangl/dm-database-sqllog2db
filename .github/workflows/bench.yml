name: Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    # NOTE: This job is data-collection-only. No regression gate is enforced.
    # Benchmark artifacts are uploaded per-commit for manual inspection.
    # To add regression detection, consider integrating bencher or
    # criterion-compare-action and downloading the previous baseline artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bench 失败不阻塞 PR merge（仅作 informational）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench

      - name: Collect benchmark results
        run: bash scripts/collect_bench_results.sh

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results-*.json
          retention-days: 60
