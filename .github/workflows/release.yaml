name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux-x86:
    name: Release sqllog2db-x86_64-linux
    runs-on: ubuntu-latest
    container: debian:buster
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y curl build-essential ca-certificates

      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/sqllog2db dist/sqllog2db-x86_64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqllog2db-x86_64-linux
          path: dist/sqllog2db-x86_64-linux
          retention-days: 1

  release-linux-arm:
    name: Release sqllog2db-aarch64-linux
    runs-on: ubuntu-24.04-arm
    container: debian:buster
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y curl build-essential ca-certificates

      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          mkdir dist
          cp target/aarch64-unknown-linux-gnu/release/sqllog2db dist/sqllog2db-aarch64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sqllog2db-aarch64-linux
          path: dist/sqllog2db-aarch64-linux
          retention-days: 1

  release:
    name: Release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sqllog2db-x86_64-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sqllog2db-aarch64-macos
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Prepare artifact
        run: |
          mkdir dist
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp target/${{ matrix.target }}/release/sqllog2db.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/sqllog2db dist/${{ matrix.artifact }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [release-linux-x86, release-linux-arm, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sqllog2db-*
          merge-multiple: true

      - name: Extract changelog
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk "/## \[${VERSION}\]/,/## \[/" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release version ${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
