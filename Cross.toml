# cross-rs 跨编译配置
# 官方镜像：https://github.com/cross-rs/cross/pkgs/container/aarch64-unknown-linux-gnu
#
# TODO(supply-chain): `edge` 是浮动标签（等于 main 分支最新构建），每次调用可能
# 指向不同镜像层，导致：
#   1. 构建不可复现 —— 相同源码两次 release 可能产出不同二进制
#   2. 供应链风险 —— 上游镜像被篡改或破坏时无任何审查门槛
# 修复方式：将 image 改为固定 SHA digest（推荐）或具体版本标签，例如：
#   image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:<digest>"
# 可通过以下命令获取当前 digest：
#   docker manifest inspect ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge --verbose | grep digest
# `latest` 标签对应 0.2.5（3 年前），故暂用 `edge` 作为权宜之计。
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
