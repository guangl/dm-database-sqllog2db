name: Link Check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/*.md'
      - 'site/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/*.md'
      - 'site/**/*.md'

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('README.md', 'CHANGELOG.md') }}
          restore-keys: lychee-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --timeout 30
            --cache
            --max-cache-age 1d
            --exclude 'https://crates.io/crates/.*'
            --exclude 'https://guangl\.github\.io/.*'
            --exclude 'https://github\.com/guangl/sqllog2db/blob/main/docs/.*'
            --exclude 'https://github\.com/guangl/sqllog2db/releases/tag/.*'
            README.md
            CHANGELOG.md
            './docs/**/*.md'
            './site/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
