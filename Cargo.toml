[package]
name = "dm-database-sqllog2db"
version = "3.0.1"
edition = "2024"
rust-version = "1.95"
authors = ["guangl <guangl@example.com>"]
description = "高性能 CLI 工具：流式解析达梦数据库 SQL 日志并导出到 Parquet 或 CSV"
documentation = "https://guangl.github.io/sqllog2db/"
homepage = "https://github.com/guangl/sqllog2db"
repository = "https://github.com/guangl/sqllog2db"
keywords = ["cli", "dm-database", "sqllog"]
categories = ["command-line-utilities"]
default-run = "sqllog2db"
license = "Apache-2.0"
readme = "README.md"

exclude = [
  "/examples/*",
  "/docs/*",
  "/.github/*",
  "/.vscode/*",
  "/logs/*",
  "/sqllogs/*",
  "/export/*",
  "/outputs/*",
  "config.toml",
]

[features]
# Keep the existing CLI behavior while allowing deployments to compile only the
# parser adapters they need. `all-parsers` is useful for development and CI.
default = ["sqllog", "driver-jdbc"]
sqllog = ["dep:dm-database-parser-sqllog"]
driver-jdbc = ["dep:dm-database-driver-log", "dm-database-driver-log/jdbc"]
driver-dm-provider = [
    "dep:dm-database-driver-log",
    "dm-database-driver-log/dm-provider",
]
all-parsers = ["sqllog", "driver-jdbc", "driver-dm-provider"]

[[bin]]
name = "sqllog2db"
path = "src/main.rs"

[[bin]]
name = "dm-sqllog2db"
path = "src/plugin_main.rs"

[dependencies]
dm-database-driver-log = { version = "0.1.1", default-features = false, optional = true }
dm-database-parser-sqllog = { version = "2.0.4", optional = true }
dm-plugin-sdk = "0.2.0"
env_logger = "0.11.10"
log = "0.4.32"
thiserror = "2.0.18"
itoa = "1.0"

clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }
ctrlc = "3"
glob = "0.3"

indicatif = "0.18"
memchr = "2"
arrow-array = "59.3.0"
arrow-schema = "59.3.0"
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd", "snap"] }


[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# 唯一保留的 allow：multiple_crate_versions 检查的是依赖图（外部 crate），不是本仓库代码。
# 剩余冲突全部在依赖自身子树内，无法从本仓库 Cargo.toml 修复：
#   - syn 2/3：过渡期宏依赖（wasm-bindgen/zerocopy + clap/serde/thiserror）
#   - wit-bindgen 0.46/0.51：tempfile -> getrandom 的 WASI 目标子树
# 待上游收敛后即可移除本行。cargo 组其余 lint 仍生效。
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.flamegraph]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
    "html_reports",
    "plotters",
] }
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[[test]]
name = "integration"
required-features = ["sqllog"]

[[test]]
name = "real_export_metadata"
required-features = ["sqllog"]

[[bench]]
name = "bench_csv"
harness = false
required-features = ["sqllog"]

[[bench]]
name = "bench_filters"
harness = false
required-features = ["sqllog"]

[[bench]]
name = "bench_parser"
harness = false
required-features = ["sqllog"]
